[program:movies-of-war-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /home/deployer/movies-of-war.com/current/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=deployer
numprocs=1
redirect_stderr=true
stdout_logfile=/home/deployer/movies-of-war.com/shared/storage/logs/worker.log
stopwaitsecs=3600
