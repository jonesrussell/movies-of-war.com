name: tests

on:
  workflow_run:
    workflows: ['linter']
    types: [completed]
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Cache vendor
        id: cache-vendor-frontend
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: vendor-8.4-

      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ hashFiles('package-lock.json') }}
          restore-keys: node-

      - name: Install PHP Dependencies
        if: steps.cache-vendor-frontend.outputs.cache-hit != 'true'
        run: composer install --no-interaction --no-progress

      - name: Install Node Dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Upload Built Assets
        uses: actions/upload-artifact@v4
        with:
          name: built-assets
          path: public/build
          retention-days: 1

      - name: Frontend Tests
        run: npm run test

  backend:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Cache vendor
        id: cache-vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: vendor-${{ matrix.php-version }}-

      - name: Install PHP Dependencies
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: composer install --no-interaction --no-progress

      - name: Download Built Assets
        uses: actions/download-artifact@v4
        with:
          name: built-assets
          path: public/build

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Backend Tests
        run: composer test
